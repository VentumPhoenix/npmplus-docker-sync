name: Integration

# The unit and contract tests prove that a payload matches the API schema.
# These tests prove that the API accepts it, that nginx serves the host and
# that a stop, a restart or a typo does not take anything down - against the
# real servers people run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly against the moving targets, so an upstream change is found
    # before somebody upgrades into it.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every pull request runs the versions this project claims to
          # support: the oldest one and the current release of each flavour.
          - name: NPM (minimum supported)
            image: jc21/nginx-proxy-manager:2.11.3
            nightly: false
          - name: NPM (current release)
            image: jc21/nginx-proxy-manager:2
            nightly: false
          - name: NPMplus (current release)
            image: ghcr.io/zoeyvid/npmplus:latest
            nightly: false
          # Moving targets: nightly only, so a broken upstream does not block
          # a pull request.
          - name: NPM (latest)
            image: jc21/nginx-proxy-manager:latest
            nightly: true
          - name: NPMplus (develop)
            image: ghcr.io/zoeyvid/npmplus:develop
            nightly: true
    steps:
      - if: matrix.nightly && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: echo "Skipping the moving target on a pull request." && exit 0

      - uses: actions/checkout@v7
        if: ${{ !matrix.nightly || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-go@v7
        if: ${{ !matrix.nightly || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the integration suite
        if: ${{ !matrix.nightly || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          NPM_IMAGE: ${{ matrix.image }}
        run: go test -tags integration -count=1 -timeout 40m -v ./test/integration/

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p npmsync-it -f test/integration/docker-compose.yml logs --no-color --tail 200 || true

      - name: Clean up
        if: always()
        run: docker compose -p npmsync-it -f test/integration/docker-compose.yml down -v --remove-orphans || true
