name: Integration

# The unit and contract tests prove that a payload matches the API schema.
# These tests prove that the API accepts it, that nginx serves the host and
# that a stop, a restart or a typo does not take anything down - against the
# real servers people run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly against the moving targets, so an upstream change is found
    # before somebody upgrades into it.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  matrix:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the versions this project claims to support.
        # Scheduled runs add the moving tags, so a broken upstream is an early
        # warning instead of a blocked pull request. The matrix is built from
        # the event, because a job-level `if` cannot read the matrix context.
        image: ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["jc21/nginx-proxy-manager:2.11.3","jc21/nginx-proxy-manager:2","ghcr.io/zoeyvid/npmplus:latest","jc21/nginx-proxy-manager:latest","ghcr.io/zoeyvid/npmplus:develop"]'
          || '["jc21/nginx-proxy-manager:2.11.3","jc21/nginx-proxy-manager:2","ghcr.io/zoeyvid/npmplus:latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the integration suite
        env:
          NPM_IMAGE: ${{ matrix.image }}
        run: go test -tags integration -count=1 -timeout 40m -v ./test/integration/

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p npmsync-it -f test/integration/docker-compose.yml logs --no-color --tail 200 || true

      - name: Clean up
        if: always()
        run: docker compose -p npmsync-it -f test/integration/docker-compose.yml down -v --remove-orphans || true
