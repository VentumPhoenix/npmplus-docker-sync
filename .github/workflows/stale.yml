name: Stale

on:
  schedule:
    - cron: "0 3 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security,roadmap"
          stale-issue-message: >
            This issue has been inactive for 60 days. Comment if it is still
            relevant, otherwise it will be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days. Comment or push
            to keep it open.
