name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # Only checked against the pinned toolchain: a newer "stable" release
      # may tidy go.mod differently and would make this step flaky.
      - name: Verify go.mod is tidy
        if: matrix.go == env.GO_VERSION
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.go == env.GO_VERSION
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # .golangci.yml uses the v2 schema, which needs golangci-lint v2 and
      # therefore action v7 or newer (v6 only speaks the v1 config format).
      #
      # The pinned golangci-lint must itself be *built* with a Go toolchain at
      # least as new as GO_VERSION - it type-checks the code with its own
      # compiled-in go/types. v2.1 is built with go1.24 and fails on Go 1.26
      # packages with "export data version 4 is greater than maximum supported
      # version 2". v2.13.2 is built with go1.27.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Wrapper instead of a bare govulncheck run: findings that are
      # reachable but reviewed live in .govulncheck-allow, everything else
      # still fails the job. See the header of the script for why.
      - run: ./scripts/govulncheck.sh

  # Builds exactly the platform set the release publishes, so a platform can
  # never break for the first time on a tag push.
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the image must start and answer "version" on the host
      # architecture. Catches a broken ENTRYPOINT or a non-static binary.
      - name: Smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: npmplus-docker-sync:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - run: docker run --rm npmplus-docker-sync:ci version
