version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
    gosec:
      excludes:
        # G402 (InsecureSkipVerify) is an explicit, documented opt-in.
        - G402
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - prealloc

formatters:
  enable:
    - gofmt
