# Nginx Proxy Manager + npmplus-docker-sync - simple
#
# The smallest stack that works: two containers, one network, the Docker
# socket mounted read-only. Good for a first try or a home lab. For anything
# reachable from the internet, use ../2-standard (socket proxy, secrets).
#
#   cp .env.example .env    # fill in the values
#   docker compose up -d
#
# Apps join the "npm" network and get labels - see ../../example-app.

services:
  npm:
    image: jc21/nginx-proxy-manager:2 # pin a full version for production
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81" # admin UI (http) - until NPM_UI_DOMAIN works
    environment:
      TZ: ${TZ:-Europe/Berlin}
      INITIAL_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL:?set NPM_ADMIN_EMAIL in .env}
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD:?set NPM_ADMIN_PASSWORD in .env}
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - npm
    labels:
      # The admin UI as a proxy host. Keep these labels: without them the tool
      # would delete the host it created for the UI.
      npm.proxy.domains: ${NPM_UI_DOMAIN:?set NPM_UI_DOMAIN in .env}
      npm.proxy.port: "81"

  npmplus-docker-sync:
    image: ghcr.io/ventumphoenix/npmplus-docker-sync:1.0.0-beta.11
    container_name: npmplus-docker-sync
    restart: unless-stopped
    depends_on:
      - npm
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      NPM_URL: http://npm:81
      NPM_IDENTITY: ${NPM_ADMIN_EMAIL}
      NPM_SECRET: ${NPM_ADMIN_PASSWORD}
      NPM_NETWORK: npm
      HEALTH_ADDR: 127.0.0.1:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket belongs to root:docker; the tool runs as 1000 and needs the
    # host's docker group: getent group docker | cut -d: -f3
    group_add:
      - "${DOCKER_GID:-988}"
    networks:
      - npm
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  npm:
    name: npm # fixed name, so apps in other compose projects can join it

volumes:
  npm-data:
  npm-letsencrypt:
