# Example workload: label a container and the resources appear in NPM.
#
#   docker compose -f docker-compose.yml -f docker-compose.example-app.yml up -d
services:
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    restart: unless-stopped
    networks:
      - npm
    labels:
      # That is the whole configuration: the port comes from the image's
      # EXPOSE, the certificate from whatever matches in NPM, and https is
      # enforced as soon as one is attached.
      npm.proxy.domains: "whoami.example.com"
      # Pin the certificate instead of letting it be chosen:
      # npm.proxy.certificate: "7"              # by id
      # npm.proxy.certificate: "name:wildcard"  # by nice name
      # npm.proxy.certificate: "new"            # request a new one
      # npm.proxy.certificate: "none"           # stay on plain http

  # One container, four NPM resources — indexed labels at work.
  demo-stack:
    image: traefik/whoami:latest
    container_name: demo-stack
    restart: unless-stopped
    networks:
      - npm
    labels:
      # 0: the application itself, with a separate /api upstream
      npm.proxy.domains: "demo.example.com"
      npm.proxy.port: "80"
      npm.proxy.location.0.path: "/api"
      npm.proxy.location.0.forward_port: "80"

      # 1: an admin UI on another port, behind an access list and forward auth
      npm.1.proxy.domains: "admin.demo.example.com"
      npm.1.proxy.port: "8080"
      npm.1.proxy.noindex: "true"
      # npm.1.proxy.access_list: "Intern"      # by name, or "2,5" by id
      # npm.1.proxy.auth_request: "authelia"   # NPMplus forward auth

      # 2: a TCP stream (NPM must publish this port itself)
      npm.2.stream.incoming_port: "5432"
      npm.2.stream.forward_port: "5432"

      # 3: redirect the legacy domain
      npm.3.redirect.domains: "old-demo.example.com"
      npm.3.redirect.forward_domain: "demo.example.com"
      npm.3.redirect.http_code: "301"

      # 4: park an unused domain on the 404 page
      npm.4.404.domains: "parked.example.com"

  # The proxy manager itself needs labels too: once this tool has created a
  # host for it, removing the labels makes that host an orphan, and
  # DELETE_ORPHANS=true would take down the admin UI with it.
  #
  # npmplus:
  #   image: ghcr.io/zoeyvid/npmplus:<pin-a-version>   # not :latest
  #   labels:
  #     npm.proxy.domains: "npm.example.com"
  #     npm.proxy.port: "81"

  # A container that should not be touched at all:
  #
  # db:
  #   image: postgres:17
  #   labels:
  #     npm.enable: "false"

networks:
  npm:
    external: true
