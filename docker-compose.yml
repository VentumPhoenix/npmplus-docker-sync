# Recommended deployment: npmplus-docker-sync never touches the raw Docker socket.
# A docker-socket-proxy filters the API and only exposes the read-only
# endpoints this tool needs (containers + events).
#
#   docker compose up -d
#
services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      # Everything defaults to 0 (denied). Only enable what is needed:
      CONTAINERS: 1 # GET /containers/json + /containers/{id}/json
      EVENTS: 1     # GET /events
      PING: 1       # GET /_ping (connection check)
      VERSION: 1    # GET /version (API version negotiation)
      INFO: 1       # GET /info (daemon id = default SYNC_INSTANCE_ID)
      POST: 0       # no write access at all
      # Explicitly denied (defaults, listed for auditability):
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    # The proxy port is never published to the host.
    expose:
      - "2375"

  npmplus-docker-sync:
    image: ghcr.io/ventumphoenix/npmplus-docker-sync:latest
    # build: .
    container_name: npmplus-docker-sync
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Recommended for the very first run against a real NPM: log what would
      # change without touching anything, then flip it to "false".
      DRY_RUN: "${DRY_RUN:-false}"
      NPM_URL: http://npm:81
      NPM_IDENTITY: ${NPM_IDENTITY:?set NPM_IDENTITY in .env}
      NPM_SECRET_FILE: /run/secrets/npm_password
      # API dialect; "auto" probes the server once at startup. Pin it to
      # npmplus or npm if detection ever guesses wrong.
      NPM_FLAVOUR: "${NPM_FLAVOUR:-auto}"
      # Upstreams use the container IP from this network (avoids DNS 502s).
      # Containers that are not attached to it are skipped with a warning
      # rather than pointed at an address NPM cannot reach.
      NPM_NETWORK: npm
      RESOLVE_CONTAINER_IP: "true"
      # Managed resource types (default: all four).
      SYNC_KINDS: proxy,redirect,stream,404
      DEBOUNCE_INTERVAL: 3s
      RESYNC_INTERVAL: 5m
      # CAUTION: a resource this tool once created keeps its ownership marker.
      # Make sure every container whose hosts you want to keep still carries
      # its npm.* labels - including the NPM/NPMplus container itself - or run
      # once with DRY_RUN=true to see what would be removed.
      DELETE_ORPHANS: "true"
      # Certificates are chosen automatically: exact match before wildcard.
      NPM_DEFAULT_CERTIFICATE: auto
      # Global defaults for any label field; a label on a container wins.
      # See docs/FIELDS.md for the full list.
      # NPM_PROXY_SSL_FORCE: "true"
      # NPM_PROXY_WEBSOCKETS: "true"
      # Take over hosts created by Redth/npm-docker-sync (docs/MIGRATION.md):
      # MIGRATE_FROM_REDTH: "false"
      # A stopped container keeps its host; it is disabled, not deleted.
      NPM_ON_STOP: disable
      NPM_STOP_GRACE: 1m
      # Refuse a run that would delete more than half of the managed hosts.
      # See docs/DELETION.md for every rule around deletion.
      DELETE_GUARD: "0.5"
      # Several sync instances against one NPM: defaults to the docker daemon
      # id, set it explicitly when the daemon id is not stable for you.
      # SYNC_INSTANCE_ID: homelab-a
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_ADDR: ":8080"
    # Uses the probe built into the binary (FROM scratch has no curl/wget).
    # start_period covers the initial NPM login + first reconcile.
    healthcheck:
      test: ["CMD", "/npmplus-docker-sync", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    secrets:
      - npm_password
    networks:
      - socket-proxy
      - npm # the network your Nginx Proxy Manager lives in
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

secrets:
  npm_password:
    file: ./secrets/npm_password.txt

networks:
  socket-proxy:
    internal: true # no outbound access for the proxy network
  npm:
    external: true
